[project]
name = "docs-rag-chatbot"
version = "0.1.0"
description = "Support chatbot over your docs with cited sources and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "openai>=2.45.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.1",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
